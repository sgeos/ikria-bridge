[workspace]

[package]
name = "ikria-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[dependencies]
ikria-records = { path = "../ikria/crates/ikria-records" }
krpc-client = { version = "=0.7.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
